<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-AR' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
 
  <header class="np-header">
    <div class="np-container">
      <div class="np-meta-bar">
        <span>Concordia, Entre Ríos</span>
        <span id="np-date"></span>
        <span><a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
      </div>
      <a href="{{ '/' | relative_url }}" class="np-masthead-link">
        <div class="np-masthead">{{ site.title }}</div>
      </a>
      <div class="np-tagline">{{ site.description }}</div>
    </div>
  </header>
 
  <nav class="np-nav">
    <div class="np-container np-nav-inner">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Inicio</a>
      <a href="{{ '/local/' | relative_url }}"{% if page.url contains '/local/' %} class="active"{% endif %}>Local</a>
      <a href="{{ '/politica/' | relative_url }}"{% if page.url contains '/politica/' %} class="active"{% endif %}>Política</a>
      <a href="{{ '/economia/' | relative_url }}"{% if page.url contains '/economia/' %} class="active"{% endif %}>Economía</a>
      <a href="{{ '/deportes/' | relative_url }}"{% if page.url contains '/deportes/' %} class="active"{% endif %}>Deportes</a>
      <a href="{{ '/cultura/' | relative_url }}"{% if page.url contains '/cultura/' %} class="active"{% endif %}>Cultura</a>
      <a href="{{ '/policiales/' | relative_url }}"{% if page.url contains '/policiales/' %} class="active"{% endif %}>Policiales</a>
    </div>
  </nav>
 
  <main class="np-main np-container">
    {{ content }}
  </main>
 
  <footer class="np-footer">
    <div class="np-container np-footer-inner">
      <span>{{ site.title }} — Concordia, Entre Ríos</span>
      <span>Actualizado automáticamente cada 6 horas</span>
      <span>concordia247.com.ar</span>
    </div>
  </footer>
 
  <script>
    const d = new Date();
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('np-date').textContent = d.toLocaleDateString('es-AR', opts);
  </script>
</body>
</html
