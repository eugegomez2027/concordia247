title: "Concordia247"
description: "Noticias de Concordia (Entre Ríos) — neutral, informativo."
url: "https://eugegit2027.github.io"
baseurl: "/concordia247"
lang: es-AR
timezone: America/Argentina/Buenos_Aires
 
# Sin tema externo — usamos nuestro propio layout
# theme: minima  ← comentado, ya no se usa
 
plugins:
  - jekyll-feed
 
show_excerpts: true
 
markdown: kramdown
kramdown:
  input: GFM
 
# Noticia de último momento (opcional — dejar vacío para ocultar la banda)
breaking_news: ""
 
# Defaults para los posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
 
